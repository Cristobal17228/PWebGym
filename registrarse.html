<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
</head>
<body>
    <header>
        <img src="imagenes/logo.png" alt="LockIn-logo">
    </header>
    <section>
        <form id="registrarse" action="inicio.html">
            Email: <input type="email" name="email"><br>
            Usuario: <input type="text" name="username"><br>
            Nombre: <input type="text" name="nombre"><br>
            Apellido: <input type="text" name="apellido"><br>
            Edad: <input type="number" name="edad" min="0" max="100"><br>
            Sexo:
            <select>
                <option>Masculino</option>
                <option>Femenino</option>
            </select><br>
            Altura: <input type="number" name="altura">m.<br>
            Peso: <input type="number" name="peso">kg.<br>
            Medicamentos: <textarea rows="2" cols="50" name="medicamentos"></textarea><br>
            Enfermedades: <textarea rows="2" cols="50" name="enfermedades"></textarea><br>
            Objetivos: <textarea rows="2" cols="50" name="objetivos"></textarea><br>
            Otros datos: <textarea rows="2" cols="50" name="otros-datos"></textarea><br>
            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
